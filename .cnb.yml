# Tencent CNB production artifact pipeline.
#
# A normal push must not deploy production. Only an explicit immutable tag in
# the form deploy/V<major>.<minor>-<12 hex source digest> is allowed to create
# a deployable Linux artifact. Activation remains a separate candidate gate.
"deploy/V*":
  tag_push:
    - name: build-linux-web-release
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: node:24.19.0-bookworm
        volumes:
          - /root/.local/share/pnpm/store:copy-on-write
      env:
        NEXT_TELEMETRY_DISABLED: "1"
        PUPPETEER_SKIP_DOWNLOAD: "1"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        npm_config_store_dir: /root/.local/share/pnpm/store
      stages:
        - name: verify-locked-toolchain
          script: |
            set -eu
            corepack enable
            corepack prepare pnpm@9.0.0 --activate
            test "$(node --version)" = "v24.19.0"
            test "$(pnpm --version)" = "9.0.0"
            test "$(uname -m)" = "x86_64"
        - name: install-frozen-dependencies
          script: |
            set -eu
            pnpm install --frozen-lockfile
            node -e 'const Database=require("better-sqlite3");const db=new Database(":memory:");if(db.prepare("select 1 as ok").get().ok!==1)throw Error("SQLITE_NATIVE_NOT_READY");db.close();require("sharp");'
        - name: verify-source-and-types
          script: |
            set -eu
            node scripts/release-workflow.mjs audit
            pnpm exec tsc --noEmit --incremental false
            node scripts/verify-release-secret-exposure.mjs
        - name: build-linux-standalone
          script: |
            set -eu
            pnpm run release:vnext:build:web
        - name: package-immutable-release
          script: |
            set -eu
            node scripts/ci/package-cnb-web-release.mjs
        - name: create-candidate-release
          type: git:release
          options:
            description: "CNB 构建候选制品；生产启用必须另行通过服务器候选验收和原子切换。"
            preRelease: true
            latest: false
        - name: retain-build-attachments
          image: cnbcool/attachments:latest
          settings:
            commit: $CNB_COMMIT
            attachments:
              - ./.cnb-artifacts/web-release.tar.gz
              - ./.cnb-artifacts/web-release.tar.gz.sha256
              - ./.cnb-artifacts/release-manifest.json
              - ./.cnb-artifacts/cnb-build-receipt.json
