name: Release browser acceptance evidence

on:
  workflow_run:
    workflows: [Release vNext staged candidate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release vNext staged candidate run ID for this exact commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-browser-acceptance-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/release-vnext.yml' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.repository.fork == false &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
      ACCEPTANCE_OUTPUT: ${{ github.workspace }}/.release-external-acceptance
      ACCEPTANCE_WORK_ROOT: /data/release-browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read the single authoritative production toolchain
        id: toolchain
        run: |
          set -euo pipefail
          policy=deploy/policies/release-policy.json
          node_version="$(jq -er '.release.productionBuild.nodeVersion | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$policy")"
          pnpm_version="$(jq -er '.release.productionBuild.pnpmVersion | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$policy")"
          jq -e '.release.productionBuild.requireFrozenLockfile == true' "$policy" >/dev/null
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=$pnpm_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ steps.toolchain.outputs.pnpm_version }}
          run_install: false

      - name: Resolve runner-scoped temporary paths
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "DATA_IMAGE=$RUNNER_TEMP/release-browser-acceptance-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ext4" >> "$GITHUB_ENV"

      - name: Verify exact candidate run provenance
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'candidate_run_id must be numeric' >&2; exit 2; }
          candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          RELEASE_TOOLCHAIN_SHA="$(git rev-parse HEAD)"
          export RELEASE_TOOLCHAIN_SHA
          printf '%s' "$candidate" > "$RUNNER_TEMP/candidate-run.json"
          candidate_sha="$(PROVENANCE_RUN_ID="$CANDIDATE_RUN_ID" node scripts/release-run-provenance.mjs candidate "$RUNNER_TEMP/candidate-run.json")"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            test "$candidate_sha" = "$GITHUB_SHA" || { echo 'AUTOMATIC_ACCEPTANCE_HEAD_DRIFT' >&2; exit 2; }
            test "$candidate_sha" = "$RELEASE_TOOLCHAIN_SHA"
            test "$candidate_sha" = "$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r .conclusion <<<"$candidate")" = success
          test "$(jq -r .name <<<"$candidate")" = 'Release vNext staged candidate'
          git cat-file -e "$candidate_sha^{commit}"
          git merge-base --is-ancestor "$candidate_sha" "$RELEASE_TOOLCHAIN_SHA"
          changed_paths="$(git diff --name-only "$candidate_sha..$RELEASE_TOOLCHAIN_SHA")"
          unexpected="$(printf '%s\n' "$changed_paths" | grep -Ev '^(\.github/workflows/release-browser-acceptance\.yml|\.github/workflows/release-vnext\.yml|\.release/source-files\.v1\.json|scripts/run-release-browser-acceptance\.mjs|scripts/release-run-provenance\.mjs|scripts/verify-release-run-provenance\.mjs|scripts/verify-release-workflow\.mjs|scripts/verify-release-change-scope-zero-network\.mjs|scripts/fixtures/release-browser-assets/portraits\.webp|scripts/fixtures/release-browser-assets/storyboard-video-captions\.vtt|scripts/fixtures/release-browser-assets/storyboard-modes-manifest\.json|scripts/fixtures/release-browser-assets/storyboard-modes-exaggerated\.webp|scripts/fixtures/release-browser-assets/storyboard-modes-cinematic\.webp|scripts/fixtures/release-browser-assets/storyboard-modes-lyrical\.webp)$' || true)"
          [[ -z "$unexpected" ]] || { printf 'candidate reuse rejected because runtime source changed:\n%s\n' "$unexpected" >&2; exit 2; }
          echo "CANDIDATE_SUBJECT_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_CANDIDATE_RUN_PATH=$RUNNER_TEMP/candidate-run.json" >> "$GITHUB_ENV"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Download the exact immutable candidate output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Install the pinned verifier toolchain
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          (cd voice-platform && pnpm --ignore-workspace install --frozen-lockfile)
          pnpm exec playwright install --with-deps chromium

      - name: Create an isolated data device for candidate readiness
        run: |
          set -euo pipefail
          if mountpoint -q /data; then echo '/data is unexpectedly already mounted' >&2; exit 2; fi
          sudo mkdir -p /data
          test -z "$(sudo find /data -mindepth 1 -maxdepth 1 -print -quit)"
          truncate -s 8G "$DATA_IMAGE"
          mkfs.ext4 -q -F "$DATA_IMAGE"
          sudo mount -o loop,nodev,nosuid "$DATA_IMAGE" /data
          sudo chown "$USER:$USER" /data
          test "$(stat -c '%d' /data)" != "$(stat -c '%d' /)"

      - name: Run exact-artifact desktop browser acceptance and sign evidence
        env:
          RELEASE_BROWSER_ACCEPTANCE_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_BROWSER_ACCEPTANCE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/run-release-browser-acceptance.mjs \
            --checkout-root "$GITHUB_WORKSPACE" \
            --candidate-root "$RUNNER_TEMP/candidate" \
            --work-root "$ACCEPTANCE_WORK_ROOT" \
            --output-root "$ACCEPTANCE_OUTPUT" \
            --issuer-id github-actions-browser-v1

      - name: Re-run the authoritative merge and release-ready gate locally
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/acceptance-authoritative-verify"
          mkdir -p "$verify_root/evidence"
          cp "$RUNNER_TEMP/candidate/release-change-scope.json" "$verify_root/scope.json"
          cp "$RUNNER_TEMP/candidate/release-change-validations.json" "$verify_root/bundle.json"
          cp -R "$RUNNER_TEMP/candidate/release-change-validation-evidence/." "$verify_root/evidence/"
          node scripts/release-change-validation-gate.mjs merge-external \
            --bundle "$verify_root/bundle.json" \
            --external-bundle .release-external-acceptance/bundle.json \
            --external-evidence-root .release-external-acceptance/evidence \
            --evidence-root "$verify_root/evidence"
          node scripts/release-change-validation-gate.mjs promote-release-ready --bundle "$verify_root/bundle.json"
          node scripts/release-change-validation-gate.mjs finalize --bundle "$verify_root/bundle.json" --target release-ready --evidence-root "$verify_root/evidence"
          node scripts/release-change-validation-gate.mjs verify-release-ready \
            --bundle "$verify_root/bundle.json" --scope-receipt "$verify_root/scope.json" --evidence-root "$verify_root/evidence"

      - name: Upload signed browser evidence for the exact commit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-browser-acceptance-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ env.ACCEPTANCE_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

      - name: Remove transient acceptance output from the checkout
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "$ACCEPTANCE_OUTPUT" && "$ACCEPTANCE_OUTPUT" == "$GITHUB_WORKSPACE/.release-external-acceptance" ]]; then
            rm -rf -- "$ACCEPTANCE_OUTPUT"
          fi

      - name: Unmount the isolated data device
        if: always()
        run: |
          set -euo pipefail
          if mountpoint -q /data; then
            source_path="$(findmnt -n -o SOURCE --target /data)"
            loop_backing="$(sudo losetup -j "$DATA_IMAGE" | cut -d: -f1 | head -n1 || true)"
            [[ -n "$loop_backing" && "$source_path" == "$loop_backing" ]] || { echo 'refusing to unmount an unexpected /data device' >&2; exit 2; }
            sudo umount /data
          fi
          if [[ -f "$DATA_IMAGE" && "$DATA_IMAGE" == "$RUNNER_TEMP"/* ]]; then rm -f -- "$DATA_IMAGE"; fi
