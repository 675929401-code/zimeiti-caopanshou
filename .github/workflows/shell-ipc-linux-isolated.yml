name: Isolated Linux shell IPC fixture
on:
  push:
    branches:
      - test/linux-shell-ipc-61e9-20261101
    paths:
      - .github/workflows/shell-ipc-linux-isolated.yml
      - .codex-shell-fixture/fixture-entry.mjs
      - .codex-shell-fixture/fixture-supervisor.mjs
      - .codex-shell-fixture/formal-controller-session-copy.sh
      - .codex-shell-fixture/journal-storage-prototype.mjs
      - .codex-shell-fixture/hook-adoption-prototype.mjs
permissions:
  contents: read
jobs:
  isolated-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify push, repository and exact branch
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TEST_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          DELETED: ${{ github.event.deleted }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "675929401-code/zimeiti-caopanshou" ]]
          [[ "$TEST_REF" == "refs/heads/test/linux-shell-ipc-61e9-20261101" ]]
          [[ "$EVENT_NAME" == "push" && "$DELETED" == "false" ]]
          [[ "$EVENT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout and all executable fixture files
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EVENT_SHA" ]]
          cd .codex-shell-fixture
          for f in fixture-entry.mjs fixture-supervisor.mjs formal-controller-session-copy.sh journal-storage-prototype.mjs hook-adoption-prototype.mjs; do [[ -f "$f" && ! -L "$f" ]]; done
          printf '%s  %s\n' \
            1cb83a27ade32907ffe50f72be6a4ba6c7269e2b82343f46b542aad970208a24 fixture-entry.mjs \
            f6cc8ec645b2bc0abea08458f6c69c42c00d235ccce755b875d0d718e597eef7 fixture-supervisor.mjs \
            f894256d2538dffcbcc294bfb8c573472329a57f034e87439e1105cd079d9e9c formal-controller-session-copy.sh \
            91458c1b0c1de52b82126417f5ee4f17efb70caec47824aad75ec613a97cd083 journal-storage-prototype.mjs \
            0c7ac0a477eb9945511d917950ecde5f3b7e8efe2837711573615200badef9ab hook-adoption-prototype.mjs | sha256sum --check --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Run isolated private tmpfs and network namespace fixture
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          fixture_path="$PWD/.codex-shell-fixture/fixture-entry.mjs"
          sudo /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/unshare --net --mount --fork -- /usr/bin/env -i PATH=/usr/bin:/bin FIXTURE_HOSTED_RUNNER=true /bin/bash -c '
            set -euo pipefail
            mount --make-rprivate /
            mkdir -p /data
            mount -t tmpfs -o mode=0755,nosuid,nodev,noexec,size=32m tmpfs /data
            "$1" "$2"
          ' fixture "$node_path" "$fixture_path"
