name: Isolated Linux process observation fixture
on:
  push:
    branches:
      - test/linux-proc-61e9-20261101
    paths:
      - .github/workflows/proc-observer-linux-isolated.yml
      - .codex-proc-fixture/linux-proc-observer.mjs
      - .codex-proc-fixture/test-linux-proc-observer.mjs
permissions:
  contents: read
jobs:
  isolated-process-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact push and hosted runner
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TEST_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          DELETED: ${{ github.event.deleted }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "675929401-code/zimeiti-caopanshou" ]]
          [[ "$TEST_REF" == "refs/heads/test/linux-proc-61e9-20261101" ]]
          [[ "$EVENT_NAME" == "push" && "$DELETED" == "false" ]]
          [[ "$EVENT_SHA" =~ ^[a-f0-9]{40}$ && "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact commit and fixture hashes
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EVENT_SHA" ]]
          cd .codex-proc-fixture
          for f in linux-proc-observer.mjs test-linux-proc-observer.mjs; do [[ -f "$f" && ! -L "$f" ]]; done
          printf '%s  %s\n' \
            7dbd3e9d60ba02920b8c6bbc945e78cdf5233249ccdd7a148281882a0999c459 linux-proc-observer.mjs \
            69131c1c0d63670654f09521c2705cd336b06ba951e3fd7511b3dc485f86d0b9 test-linux-proc-observer.mjs | sha256sum --check --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify only a synthetic subprocess without network
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          sudo /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/unshare --net -- /usr/bin/env -i PATH=/usr/bin:/bin HOME=/root "$node_path" .codex-proc-fixture/test-linux-proc-observer.mjs
