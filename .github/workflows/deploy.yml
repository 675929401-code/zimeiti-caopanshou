name: legacy-deploy-disabled

# 历史 build-and-deploy 工作流已停用。
# 本文件只保留为 GitHub Actions 中的显式废止提示：
# - 不响应 push；
# - 不构建、上传或激活生产；
# - 正式构建只使用 release-vnext.yml（build-only）；
# - 生产端只按当前正式规约使用 deploy-artifact-vnext.sh --plan / --execute。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deploy-disabled:
    name: 旧生产部署入口已停用
    runs-on: ubuntu-24.04
    steps:
      - name: 显示现行入口
        run: |
          echo "deploy.yml is disabled and cannot deploy or activate production."
          echo "Use release-vnext.yml for build-only artifacts."
          echo "Follow the current F-drive deployment policy for artifact plan and execute."
